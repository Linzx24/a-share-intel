  <script>
(function () {
  const root = document.documentElement;
  const page = document.querySelector('.page');
  const links = Array.from(document.querySelectorAll('[data-channel-link]'));
  const panels = Array.from(document.querySelectorAll('[data-channel-panel]'));
  const showAll = document.getElementById('show-all');
  const live = document.getElementById('channel-live');
  if (!links.length || !panels.length) return;

  root.classList.add('tabs-ready');
  document.querySelector('.channel-links').setAttribute('role', 'tablist');
  links.forEach((link) => {
    link.setAttribute('role', 'tab');
    link.setAttribute('aria-controls', 'channel-' + link.dataset.channelLink);
  });
  panels.forEach((panel) => {
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', 'channel-link-' + panel.dataset.channelPanel);
  });

  function panelForHash(hash) {
    if (!hash) return panels[0];
    const target = document.getElementById(hash.replace(/^#/, ''));
    if (!target) return panels[0];
    return target.matches('[data-channel-panel]') ? target : target.closest('[data-channel-panel]') || panels[0];
  }

  function activate(panel, options) {
    const opts = options || {};
    const id = panel.dataset.channelPanel;
    page.classList.remove('full-view');
    panels.forEach((item) => { item.hidden = item !== panel; item.classList.remove('is-entering'); });
    links.forEach((link) => {
      const active = link.dataset.channelLink === id;
      link.setAttribute('aria-selected', active ? 'true' : 'false');
      link.tabIndex = active ? 0 : -1;
    });
    panel.classList.add('is-entering');
    window.setTimeout(() => panel.classList.remove('is-entering'), 180);
    const activeLink = links.find((link) => link.dataset.channelLink === id);
    if (activeLink && window.innerWidth <= 760) {
      activeLink.scrollIntoView({block: 'nearest', inline: 'center'});
    }
    if (live) live.textContent = '已切换到' + (activeLink ? activeLink.dataset.label : id) + '频道';
    if (opts.updateHash) history.pushState(null, '', '#channel-' + id);
    if (opts.focus && activeLink) activeLink.focus();
  }

  links.forEach((link, index) => {
    link.addEventListener('click', (event) => {
      event.preventDefault();
      const panel = document.getElementById('channel-' + link.dataset.channelLink);
      activate(panel, {updateHash: true});
      window.setTimeout(() => panel.scrollIntoView({block: 'start'}), 10);
    });
    link.addEventListener('keydown', (event) => {
      const vertical = window.innerWidth > 760;
      let next = null;
      if (event.key === 'Home') next = 0;
      if (event.key === 'End') next = links.length - 1;
      if (event.key === 'ArrowRight' || (vertical && event.key === 'ArrowDown')) next = (index + 1) % links.length;
      if (event.key === 'ArrowLeft' || (vertical && event.key === 'ArrowUp')) next = (index - 1 + links.length) % links.length;
      if (next !== null) {
        event.preventDefault();
        activate(document.getElementById('channel-' + links[next].dataset.channelLink), {updateHash: true, focus: true});
      }
    });
  });

  document.addEventListener('click', (event) => {
    const anchor = event.target.closest('a[href^="#event-"]');
    if (!anchor) return;
    const target = document.querySelector(anchor.getAttribute('href'));
    if (!target) return;
    event.preventDefault();
    const panel = target.closest('[data-channel-panel]');
    activate(panel, {});
    if (target.tagName === 'DETAILS') target.open = true;
    history.pushState(null, '', anchor.getAttribute('href'));
    window.setTimeout(() => target.scrollIntoView({block: 'start'}), 10);
  });

  showAll.addEventListener('click', () => {
    const full = !page.classList.contains('full-view');
    page.classList.toggle('full-view', full);
    panels.forEach((panel) => { panel.hidden = false; });
    showAll.textContent = full ? '返回频道视图' : '显示全文';
    showAll.setAttribute('aria-pressed', full ? 'true' : 'false');
    if (!full) activate(panelForHash(location.hash), {});
  });

  window.addEventListener('hashchange', () => {
    const panel = panelForHash(location.hash);
    activate(panel, {});
    const target = document.getElementById(location.hash.replace(/^#/, ''));
    if (target && target.tagName === 'DETAILS') target.open = true;
  });

  const initialPanel = panelForHash(location.hash);
  activate(initialPanel, {});
  const initialTarget = document.getElementById(location.hash.replace(/^#/, ''));
  if (initialTarget && initialTarget.tagName === 'DETAILS') initialTarget.open = true;
})();
</script>
